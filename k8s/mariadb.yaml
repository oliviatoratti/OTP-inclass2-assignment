apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assignment6-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment6-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assignment6-mariadb
  template:
    metadata:
      labels:
        app: assignment6-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: assignment6
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assignment6-db-secret
                  key: root-password
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: assignment6-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: assignment6-mariadb
spec:
  selector:
    app: assignment6-mariadb
  ports:
    - port: 3306
      targetPort: 3306